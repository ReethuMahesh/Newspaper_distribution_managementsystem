  <style>
    :root {
      --primary-color: #5c2e14;
      --accent-color: #decaab;
      --text-color: black;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: "Segoe UI", sans-serif;
      display: flex;
      min-height: 100vh;
      background-color: #f9f7f1;
      color: var(--text-color);
    }
    .sidebar {
      width: 250px;
      background-color: var(--primary-color);
      color: #fff;
      display: flex;
      flex-direction: column;
      padding: 20px;
      transition: transform 0.3s ease;
      overflow-y: auto;
      max-height: 100vh;
      min-height: 100vh;
    }
    .sidebar h2 {
      font-size: 1.5rem;
      margin-bottom: 30px;
      font-weight: bold;
      text-align: center;
    }
    .sidebar a {
      text-decoration: none;
      color: #fff;
      padding: 12px 20px;
      margin: 5px 0;
      border-radius: 6px;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sidebar a:hover {
      background-color: var(--accent-color);
      color: var(--text-color);
      transform: translateX(5px);
    }
    #datetime {
      position: fixed;
      bottom: 20px;
      left: 20px;
      font-size: 1rem;
      color: white;
      padding: 10px;
      background-color: black;
      border-radius: 6px;
      font-family: "Segoe UI", sans-serif;
      z-index: 100;
    }
    .main-content {
      flex: 1;
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
    }
    .main-content h1 {
      margin-bottom: 20px;
      color: var(--primary-color);
      font-size: 2rem;
      font-weight: bold;
    }
    .complaints-table-container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
      padding: 30px;
      margin-top: 10px;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 1rem;
      min-width: 600px;
    }
    th,
    td {
      padding: 14px 12px;
      text-align: left;
    }
    th {
      background-color: var(--primary-color);
      color: #fff;
      font-weight: 600;
    }
    tr:nth-child(even) {
      background-color: #f3ede4;
    }
    tr:hover {
      background-color: var(--accent-color);
      transition: background 0.2s;
    }
    .status {
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 0.95em;
      font-weight: 500;
      display: inline-block;
    }
    .status.open {
      background: #ffd966;
      color: #7c6700;
    }
    .status.closed {
      background: #c6efce;
      color: #27632a;
    }
    .status.pending {
      background: #f4cccc;
      color: #a61c00;
    }
    .complaint-form {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      padding: 24px 30px 16px 30px;
      margin-bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      align-items: flex-end;
    }
    .complaint-form label {
      font-weight: 500;
      margin-bottom: 4px;
      display: block;
    }
    .complaint-form input,
    .complaint-form select,
    .complaint-form textarea {
      padding: 8px 10px;
      border: 1px solid #c5b8a0;
      border-radius: 6px;
      font-size: 1rem;
      width: 220px;
      background: #f9f7f1;
      margin-bottom: 8px;
    }
    .complaint-form textarea {
      resize: vertical;
      min-height: 38px;
      max-width: 320px;
      width: 320px;
    }
    .complaint-form button {
      background: var(--primary-color);
      color: #fff;
      border: none;
      padding: 10px 22px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }
    .complaint-form button:hover {
      background: var(--accent-color);
      color: var(--text-color);
    }
    @media (max-width: 900px) {
      .main-content {
        padding: 20px 5px;
      }
      table {
        font-size: 0.95rem;
        min-width: 400px;
      }
      .complaint-form input,
      .complaint-form select,
      .complaint-form textarea {
        width: 100%;
        max-width: 100%;
      }
      .complaint-form {
        flex-direction: column;
        gap: 10px;
      }
    }
    @media (max-width: 700px) {
      body {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        min-height: unset;
        max-height: 200px;
        position: relative;
      }
      .main-content {
        padding: 10px 3px;
      }
      #datetime {
        left: unset;
        right: 10px;
        bottom: 10px;
      }
    }
  </style>

  <script>
  // Date/time
  function updateDateTime() {
    const now = new Date();
    const options = {
      weekday: "long",
      year: "numeric",
      month: "long",
      day: "numeric",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      timeZoneName: "short",
    };
    document.getElementById("datetime").textContent = now.toLocaleDateString(
      "en-IN",
      options
    );
  }
  setInterval(updateDateTime, 1000);
  updateDateTime();

  const customerIdInput = document.getElementById('customerId');
  const customerNameInput = document.getElementById('customerName');
  const addButton = document.querySelector('.complaint-form button');

  // Initially disable Add Complaint button
  addButton.disabled = true;

  // Auto-fetch customer name by customerId
  customerIdInput.addEventListener('blur', async function() {
    const customerId = this.value.trim();
    if (!customerId) {
      customerNameInput.value = '';
      addButton.disabled = true;
      return;
    }
    try {
      const res = await fetch(`/api/customers/by-id/${encodeURIComponent(customerId)}`);
      if (res.ok) {
        const data = await res.json();
        if (data.customerName) {
          customerNameInput.value = data.customerName;
          addButton.disabled = false;
        } else {
          customerNameInput.value = '';
          addButton.disabled = true;
          alert('Customer not found.');
        }
      } else {
        customerNameInput.value = '';
        addButton.disabled = true;
        alert('Customer not found.');
      }
    } catch (err) {
      customerNameInput.value = '';
      addButton.disabled = true;
      alert('Error fetching customer. Please try again.');
    }
  });

// Fetch and display all complaints
async function fetchAndDisplayComplaints() {
  try {
    const response = await fetch('/api/complaints');
    const complaints = await response.json();
    const tbody = document.querySelector('#complaintsTable tbody');
    tbody.innerHTML = ''; // Clear existing rows

    complaints.forEach(c => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${c.customerId}</td>
        <td>${c.customerName}</td>
        <td>${c.complaint}</td>
        <td>${c.status}</td>
        <td>${new Date(c.createdAt).toLocaleString()}</td>
      `;
      tbody.appendChild(tr);
    });
  } catch (err) {
    console.error('Error fetching complaints:', err);
  }
}

// Call once on page load
fetchAndDisplayComplaints();


document.getElementById('complaintForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const customerId = document.getElementById('customerId').value.trim();
  const customerName = document.getElementById('customerName').value.trim();
  const complaint = document.getElementById('complaint').value.trim();
  const status = document.getElementById('status').value;

  if (!customerId || !customerName || !complaint) {
    alert('Please fill all required fields.');
    return;
  }

  try {
    const response = await fetch('/api/complaints', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ customerId, customerName, complaint, status })
    });

    if (response.ok) {
      alert('Complaint stored successfully!');
      this.reset();
      fetchAndDisplayComplaints(); // <-- Refresh the table!
    } else {
      const error = await response.json();
      alert('Error: ' + (error.message || 'Failed to store complaint'));
    }
  } catch (err) {
    alert('Network error: ' + err.message);
  }
});
