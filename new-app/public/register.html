<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<style>
    main {
      background: #f9f7f1;
      padding: 60px 20px;
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #register {
      background: #fff;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      animation: fadeIn 0.8s ease-in-out;
    }

    #register h2 {
      text-align: center;
      margin-bottom: 30px;
      font-family: 'Cinzel', serif;
      font-size: 2rem;
      color: #333;
    }

    form label {
      display: block;
      margin: 15px 0 5px;
      font-weight: bold;
      font-size: 0.95rem;
      color: #444;
    }

    form input,
    form select {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      background: #fafafa;
      transition: border-color 0.3s;
    }

    form input:focus,
    form select:focus {
      border-color: #000428;
      outline: none;
      background: #fff;
    }

    .captcha {
      margin: 20px 0;
    }

    #captcha-canvas {
      background-color: #f0f0f0;
      border: 1px solid #ccc;
      margin: 10px 0;
      display: block;
    }

    .password-wrapper {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 1.2em;
      color: #333;
    }

    .validation-message {
      color: red;
      font-size: 0.85rem;
      margin-top: -8px;
      margin-bottom: 10px;
    }

    button.button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      background: #000428;
      color: #fff;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
    }

    button.button:hover {
      background: #004e92;
      transform: translateY(-2px);
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #1e1e1e;
      color: #ccc;
      font-size: 14px;
    }
    .already-account {
  text-align: center;
  margin-top: 15px;
  font-size: 0.95rem;
}

.already-account a {
  color: #004e92;
  font-weight: bold;
  text-decoration: none;
  transition: color 0.3s;
}

.already-account a:hover {
  color: #000428;
}

</style>
<body>
  <header>
    <div class="logo">PathraVahak</div>
    <nav>
      <ul>
        <li><a href="./index.html">Home</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="register.html" class="active">Sign Up</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="register" class="login-prompt">
      <h2>Create an Account</h2>
      <form id="registerForm" method="post" action="/api/register" onsubmit="return validateForm()">
          <label for="name">Name:</label>
  <input type="text" id="name" name="name" placeholder="Your Name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Your Email" required>
        <div id="email-msg" class="validation-message"></div>

      

  <label for="phone">Phone Number:</label>
  <input type="tel" id="phone" name="phone" placeholder="Your Phone Number" required>

        <label for="password">Password:</label>
        <div class="password-wrapper">
          <input type="password" id="password" name="password" placeholder="Your Password" required>
          <span class="toggle-password" onclick="togglePassword()">👁️</span>
        </div>
        <div id="password-msg" class="validation-message"></div>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required>

        <label for="gender">Gender:</label>
        <select id="gender" name="gender" required>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>

        <label for="city">City:</label>
        <input type="text" id="city" name="city" placeholder="Your City" required>

        <label for="zipcode">Zipcode:</label>
        <input type="text" id="zipcode" name="zipcode" placeholder="Your Zipcode" required>

        <div class="captcha">
          <label for="captcha">Captcha:</label><br>
          <canvas id="captcha-canvas" width="150" height="40"></canvas><br>
          <input type="text" id="captcha" name="captcha" placeholder="Enter Captcha" required>
        </div>

        <button type="submit" class="button">Sign Up</button>
        <div class="already-account">
            Already have an account? <a href="login.html">Log in</a>
          </div>
          
      </form>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-bottom">
      <p>&copy; 2025 Daily Press. All rights reserved.</p>
    </div>
  </footer>

  <script>
    let generatedCaptcha = '';

    function generateCaptchaCanvas() {
      const canvas = document.getElementById('captcha-canvas');
      const ctx = canvas.getContext('2d');
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
      generatedCaptcha = '';

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.font = '24px monospace';
      ctx.fillStyle = '#000';

      for (let i = 0; i < 6; i++) {
        const char = chars.charAt(Math.floor(Math.random() * chars.length));
        generatedCaptcha += char;
        ctx.fillText(char, 20 + i * 18, 30);
      }

      for (let i = 0; i < 3; i++) {
        ctx.strokeStyle = '#aaa';
        ctx.beginPath();
        ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
        ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
        ctx.stroke();
      }
    }

    function togglePassword() {
      const passwordInput = document.getElementById("password");
      const toggleText = document.querySelector(".toggle-password");
      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        toggleText.textContent = "🙈";
      } else {
        passwordInput.type = "password";
        toggleText.textContent = "👁️";
      }
    }

    function validateForm() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const captcha = document.getElementById("captcha").value;

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      const passwordRegex = /^(?=.*[!@#$%^&*(),.?":{}|<>]).{8,}$/;

      if (!emailRegex.test(email)) {
        alert("Please enter a valid email address.");
        return false;
      }

      if (!passwordRegex.test(password)) {
        alert("Password must be at least 8 characters long and include at least one special character.");
        return false;
      }

      if (captcha !== generatedCaptcha) {
        alert("Captcha does not match.");
        generateCaptchaCanvas();
        return false;
      }

      return true;
    }

    document.getElementById("email").addEventListener("input", function () {
      const email = this.value;
      const msg = document.getElementById("email-msg");
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (email && !emailRegex.test(email)) {
        msg.textContent = "Invalid email format (e.g., user@example.com)";
      } else {
        msg.textContent = "";
      }
    });

    document.getElementById("password").addEventListener("input", function () {
      const password = this.value;
      const msg = document.getElementById("password-msg");
      const minLength = password.length >= 8;
      const specialChar = /[!@#$%^&*(),.?":{}|<>]/.test(password);

      if (!minLength || !specialChar) {
        msg.textContent = "Password must be at least 8 characters and include a special character.";
      } else {
        msg.textContent = "";
      }
    });

    window.onload = generateCaptchaCanvas;
  </script>
</body>
</html>
