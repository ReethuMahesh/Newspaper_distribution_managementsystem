<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Employees | PathraVahak</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <style>
      :root {
        --primary-color: #5c2e14;
        --accent-color: #decaab;
        --text-color: black;
        --table-header-color: #f2f2f2;
        --table-border-color: #ddd;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", sans-serif;
        display: flex;
        min-height: 100vh;
        background-color: #f9f7f1;
        color: var(--text-color);
      }

      .sidebar {
        width: 250px;
        background-color: var(--primary-color);
        color: #fff;
        display: flex;
        flex-direction: column;
        padding: 20px;
        transition: transform 0.3s ease;
        overflow-y: auto;
        max-height: 100vh;
      }

      .sidebar h2 {
        font-size: 1.5rem;
        margin-bottom: 30px;
        font-weight: bold;
        text-align: center;
      }

      .sidebar a {
        text-decoration: none;
        color: #fff;
        padding: 12px 20px;
        margin: 5px 0;
        border-radius: 6px;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .sidebar a:hover {
        background-color: var(--accent-color);
        color: var(--text-color);
        transform: translateX(5px);
      }

      #datetime {
        position: fixed;
        bottom: 20px;
        left: 20px;
        font-size: 1rem;
        color: white;
        padding: 10px;
        background-color: var(--primary-color);
        border-radius: 6px;
        font-family: "Segoe UI", sans-serif;
      }

      #datetime {
        background-color: black;
      }

      .content {
        flex: 1;
        padding: 20px;
      }

      h1 {
        margin-bottom: 20px;
        font-size: 2rem;
        color: var(--primary-color);
        text-align: center;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }

      th,
      td {
        padding: 12px;
        text-align: center;
        border: 1px solid var(--table-border-color);
      }

      th {
        background-color: var(--primary-color); /* your accent color */
        color: #fff; /* your primary color for text */
        font-weight: bold;
        padding: 12px;
        text-align: center;
      }

      td {
        background-color: #fff;
        color: var(--text-color);
      }

      tr:nth-child(even) td {
        background-color: #f9f9f9;
      }

      tr:hover td {
        background-color: var(--accent-color);
        color: var(--text-color);
      }

      td,
      th {
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="sidebar" id="sidebar">
      <h2 style="display: flex; align-items: center; gap: 10px">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="28"
          height="28"
          viewBox="0 0 24 24"
          fill="white"
        >
          <path
            d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 7h10v2H7V7zm0 4h7v2H7v-2zm0 4h10v2H7v-2z"
          />
        </svg>
        PathraVahak
      </h2>

      <a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
      <a href="employees.html"><i class="fas fa-users-cog"></i> Employees</a>
      <a href="subscriptions.html"
        ><i class="fas fa-newspaper"></i> Subscriptions</a
      >
      <a href="customers.html"><i class="fas fa-users"></i> Customers</a>
      <a href="deliveries.html"><i class="fas fa-box"></i> Deliveries</a>
      <a href="payments.html"><i class="fas fa-money-bill"></i> Payments</a>
      <a href="complaints.html"
        ><i class="fas fa-exclamation-circle"></i> Complaints</a
      >
      <a href="newspapers.html"><i class="fas fa-book-open"></i> Newspapers</a>
      <a href="retailoutlets.html"
        ><i class="fas fa-store"></i> Retail Outlets</a
      >
      <a href="retailsales.html"
        ><i class="fas fa-shopping-cart"></i> Retail Sales</a
      >
      <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>
      <a href="/api/logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>

    <div class="content">
      <h1>Retail Sales</h1>
      <table id="retailSalesTable">
        <thead>
          <tr>
            <th>Retail Outlet Name</th>
            <th>Newspaper Name</th>
            <th>Quantity Sold</th>
            <th>Unit Price</th>
            <th>Sale Date</th>
          </tr>
        </thead>
        <tbody id="retailSalesBody">
          <!-- Retail outlet data will be populated here -->
        </tbody>
      </table>
    </div>

    <div id="datetime"></div>

    <script>
      function updateDateTime() {
        const now = new Date();
        const options = {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          timeZoneName: "short",
        };
        document.getElementById("datetime").textContent =
          now.toLocaleDateString("en-IN", options);
      }

      setInterval(updateDateTime, 1000);
      updateDateTime(); // Initial call

      document.addEventListener("DOMContentLoaded", function () {
        fetch("/api/retailsales")
          .then((res) => res.json())
          .then((data) => {
            const tbody = document.getElementById("retailSalesBody");
            tbody.innerHTML = "";
            data.forEach((sale) => {
              const tr = document.createElement("tr");
              tr.innerHTML = `
          <td>${sale.outletName}</td>
          <td>${sale.newspaperName}</td>
          <td>${sale.quantitySold}</td>
          <td>${sale.unitPrice.toFixed(2)}</td>
          <td>${new Date(sale.saleDate).toLocaleDateString("en-IN")}</td>
        `;
              tbody.appendChild(tr);
            });
          })
          .catch((err) => {
            console.error("Error fetching retail sales:", err);
          });
      });
    </script>
    <script src="js/main.js"></script>
  </body>
</html>
