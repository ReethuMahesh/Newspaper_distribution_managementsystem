<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employees | PathraVahak</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #5C2E14;
      --accent-color: #decaab;
      --text-color: black;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      min-height: 100vh;
      background-color: #f9f7f1;
      color: var(--text-color);
    }

    .sidebar {
      width: 250px;
      background-color: var(--primary-color);
      color: #fff;
      display: flex;
      flex-direction: column;
      padding: 20px;
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      z-index: 1000;
      overflow-y: auto;
    }

    .sidebar h2 {
      font-size: 1.5rem;
      margin-bottom: 30px;
      font-weight: bold;
      text-align: center;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar a {
      text-decoration: none;
      color: #fff;
      padding: 12px 20px;
      margin: 5px 0;
      border-radius: 6px;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar a:hover {
      background-color: var(--accent-color);
      color: var(--text-color);
      transform: translateX(5px);
    }

    /* Time styling on the sidebar */
    #datetime {
      position: fixed;
      bottom: 20px;
      left: 20px;
      font-size: 1rem;
      color: white;
      background-color: black;
      padding: 10px;
      /* background-color: var(--primary-color); */
      border-radius: 6px;
      font-family: 'Segoe UI', sans-serif;
      z-index: 2001;
    }

    .main-content {
      flex: 1;
      padding: 30px;
      width: 100%;
      margin-left: 250px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }

    h1 {
      text-align: center;
      color: var(--primary-color);
      margin-bottom: 20px;
      font-size: 2rem;
      width: 100%;
    }

    h1::before {
      content: "PathraVahak";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-30deg);
      font-size: 6rem;
      color: rgba(0, 0, 0, 0.12);
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
    }

    .toggle-bar {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .toggle-bar button {
      padding: 10px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background-color: var(--primary-color);
      color: #fff;
      transition: background 0.3s ease;
    }

    .toggle-bar button:hover,
    .toggle-bar button.active {
      background-color: var(--accent-color);
      color: var(--text-color);
    }

    #viewSection, #addSection {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      box-sizing: border-box;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    table th, table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }

    table th {
      background-color: var(--primary-color);
      color: #fff;
    }

    #addSection {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #addSection form {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
    }

    form label {
      margin-bottom: 6px;
      font-weight: 500;
    }

    form input, form select {
      width: 100%;
      padding: 10px 14px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    form .error {
      color: red;
      font-size: 0.85rem;
      margin-top: -10px;
      margin-bottom: 10px;
    }

    form button {
      padding: 10px 16px;
      font-size: 1rem;
      background-color: var(--primary-color);
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.3s ease;
    }

    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
      }

      .sidebar.active {
        transform: translateX(0);
      }

      .main-content {
        margin-left: 0;
      }

      #addSection form {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="sidebar" id="sidebar">
    <h2>
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="white">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 7h10v2H7V7zm0 4h7v2H7v-2zm0 4h10v2H7v-2z"/>
      </svg>
      PathraVahak
    </h2>
    <a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
    <a href="employees.html"><i class="fas fa-users-cog"></i> Employees</a>
    <a href="subscriptions.html"><i class="fas fa-newspaper"></i> Subscriptions</a>
    <a href="customers.html"><i class="fas fa-users"></i> Customers</a>
    <a href="deliveries.html"><i class="fas fa-box"></i> Deliveries</a>
    <a href="payments.html"><i class="fas fa-money-bill"></i> Payments</a>
    <a href="complaints.html"><i class="fas fa-exclamation-circle"></i> Complaints</a>
    <a href="newspapers.html"><i class="fas fa-book-open"></i> Newspapers</a>
    <a href="retailoutlets.html"><i class="fas fa-store"></i> Retail Outlets</a>
    <a href="retailsales.html"><i class="fas fa-shopping-cart"></i> Retail Sales</a>
    <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>
    <a href="/api/logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
  </div>

  <!-- Removed <span id="datetime"></span> -->

  <div class="main-content">
    <h1>Employees Management</h1>

    <div class="toggle-bar">
      <button id="viewBtn" class="active">View Employees</button>
      <button id="addBtn">Add Employee</button>
    </div>

    <div id="viewSection" class="section">
      <h2>View Employees</h2>
      <table>
        <thead>
          <tr>
            <th>Employee ID</th>
            <th>Name</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Assigned Area</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="employeeTableBody">
        </tbody>
      </table>
    </div>

    <div id="addSection" class="section" style="display: none;">
      <h2>Add Employee</h2>
      <form id="employeeForm" novalidate>
        <label for="employeeid">Employee ID (Auto-generated)</label>
        <input type="text" id="employeeid" name="employeeid" readonly value="Auto-generated">

        <label for="empname">Employee Name</label>
        <input type="text" id="empname" name="empname" required>

        <label for="phonenumber">Phone Number</label>
        <input type="text" id="phonenumber" name="phonenumber" required>
        <div class="error" id="phoneError"></div>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
        <div class="error" id="emailError"></div>

        <label for="assignedarea">Assigned Area</label>
        <select id="assignedarea" name="assignedarea" required>
          <option value="">Select Area</option>
          <option value="Toll Naka">Toll Naka</option>
          <option value="Vidyagiri">Vidyagiri</option>
          <option value="Gandhinagar">Gandhinagar</option>
          <option value="Lakmanahalli">Lakmanahalli</option>
          <option value="Y.Shettar Colony">Y.Shettar Colony</option>
        </select>

        <label for="empstatus">Employee Status</label>
        <select id="empstatus" name="empstatus" required>
          <option value="">Select Status</option>
          <option value="Active">Active</option>
          <option value="Inactive">Inactive</option>
        </select>

        <button type="submit">Add Employee</button>
      </form>
    </div>
  </div>
  <div id="datetime"></div>

  <script>
    function updateDateTime() {
      const now = new Date();
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', timeZoneName: 'short' };
      document.getElementById('datetime').textContent = now.toLocaleDateString('en-IN', options);
    }

    setInterval(updateDateTime, 1000);
    updateDateTime(); // Initial call

    const viewBtn = document.getElementById('viewBtn');
    const addBtn = document.getElementById('addBtn');
    const viewSection = document.getElementById('viewSection');
    const addSection = document.getElementById('addSection');
    const employeeForm = document.getElementById('employeeForm');

    let editMode = false;
    let editEmployeeId = null;

    viewBtn.addEventListener('click', () => {
      viewSection.style.display = 'block';
      addSection.style.display = 'none';
      viewBtn.classList.add('active');
      addBtn.classList.remove('active');
      loadEmployees();
      resetForm();
    });

    addBtn.addEventListener('click', () => {
      viewSection.style.display = 'none';
      addSection.style.display = 'block';
      addBtn.classList.add('active');
      viewBtn.classList.remove('active');
      generateEmployeeId();
      resetForm();
    });

    function resetForm() {
      employeeForm.reset();
      document.getElementById('employeeid').value = 'Auto-generated';
      document.getElementById('phoneError').textContent = '';
      document.getElementById('emailError').textContent = '';
      document.querySelector('#employeeForm button').textContent = 'Add Employee';
      editMode = false;
      editEmployeeId = null;
    }

    const phoneInput = document.getElementById('phonenumber');
    const emailInput = document.getElementById('email');
    const phoneError = document.getElementById('phoneError');
    const emailError = document.getElementById('emailError');

    phoneInput.addEventListener('input', () => {
      const phoneRegex = /^[0-9]{10}$/;
      phoneError.textContent = phoneRegex.test(phoneInput.value) ? "" : "Phone number must be 10 digits.";
    });

    emailInput.addEventListener('input', () => {
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      emailError.textContent = emailRegex.test(emailInput.value) ? "" : "Invalid email format.";
    });

   employeeForm.addEventListener('submit', async (e) => {
  e.preventDefault();

  const employeeid = document.getElementById('employeeid').value.trim();
  const empname = document.getElementById('empname').value.trim();
  const phonenumber = document.getElementById('phonenumber').value.trim();
  const email = document.getElementById('email').value.trim();
  const assignedarea = document.getElementById('assignedarea').value.trim();
  const empstatus = document.getElementById('empstatus').value.trim();

  // --- Frontend Validation ---
  if (!empname) {
    alert('Please enter employee name.');
    return;
  }
  if (!phonenumber || !/^\d{10}$/.test(phonenumber)) {
    alert('Please enter a valid 10-digit phone number.');
    return;
  }
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    alert('Please enter a valid email address.');
    return;
  }
  if (!assignedarea) {
    alert('Please select an assigned area.');
    return;
  }
  if (!empstatus) {
    alert('Please select employee status.');
    return;
  }

  const payload = { employeeId: employeeid, empname, phonenumber, email, assignedarea, empstatus };

  try {
    let res;
    if (editMode && editEmployeeId) {
      res = await fetch(`/api/employees/${editEmployeeId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
    } else {
      res = await fetch('/api/employees', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
    }

    if (res.ok) {
      alert(editMode ? 'Employee updated successfully!' : 'Employee added successfully!');
      resetForm();
      viewBtn.click();
    } else {
      const errorText = await res.text();
      alert('Error: ' + errorText);
    }
  } catch (err) {
    alert('Server error');
    console.error(err);
  }
});

    async function loadEmployees() {
      try {
        const res = await fetch('/api/employees');
        const data = await res.json();
        const tableBody = document.getElementById('employeeTableBody');
        tableBody.innerHTML = '';

        data.forEach(emp => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${emp.employeeId}</td>
            <td>${emp.empname}</td>
            <td>${emp.phonenumber}</td>
            <td>${emp.email}</td>
            <td>${emp.assignedarea}</td>
            <td>${emp.empstatus}</td>
            <td>
              <button onclick="editEmployee('${emp._id}')" style="margin-right: 8px; background-color: #decaab; color: black; padding: 5px 10px; border-radius: 4px; border: none;">Edit</button>
              <button onclick="deleteEmployee('${emp._id}')" style="background-color: #5C2E14; color: white; padding: 5px 10px; border-radius: 4px; border: none;">Delete</button>
            </td>
          `;
          tableBody.appendChild(row);
        });
      } catch (err) {
        console.error('Failed to load employees:', err);
      }
    }

    async function generateEmployeeId() {
      try {
        const res = await fetch('/api/employees/latest-id');
        const data = await res.json();
        document.getElementById('employeeid').value = data.nextId;
      } catch (err) {
        console.error('Failed to generate ID:', err);
        document.getElementById('employeeid').value = 'Auto-generated';
      }
    }

    async function deleteEmployee(id) {
      if (confirm("Are you sure you want to delete this employee?")) {
        try {
          const res = await fetch(`/api/employees/${id}`, {
            method: 'DELETE'
          });

          if (res.ok) {
            alert("Employee deleted successfully.");
            loadEmployees();
          } else {
            const error = await res.text();
            alert("Delete failed: " + error);
          }
        } catch (err) {
          console.error("Error deleting employee:", err);
          alert("Server error while deleting.");
        }
      }
    }

    async function editEmployee(employeeId) {
      editMode = true;
      editEmployeeId = employeeId;

      // Switch to Add section
      addSection.style.display = 'block';
      viewSection.style.display = 'none';
      addBtn.classList.add('active');
      viewBtn.classList.remove('active');

      try {
        const response = await fetch(`/api/employees/${employeeId}`);
        const employee = await response.json();

        document.getElementById('employeeid').value = employee.employeeId;
        document.getElementById('empname').value = employee.empname;
        document.getElementById('phonenumber').value = employee.phonenumber;
        document.getElementById('email').value = employee.email;
        document.getElementById('assignedarea').value = employee.assignedarea;
        document.getElementById('empstatus').value = employee.empstatus;

        document.querySelector('#employeeForm button').textContent = 'Update Employee';
      } catch (error) {
        console.error('Error fetching employee data:', error);
        alert('Failed to load employee data.');
      }
    }
  </script>
  <script src="js/main.js"></script>
</body>
</html>
