<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customers | PathraVahak</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #5C2E14;
      --accent-color: #decaab;
      --text-color: black;
    }
  
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
  
    body {
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      height: 100vh; /* full viewport height */
      background-color: #f9f7f1;
      color: var(--text-color);
      overflow: hidden; /* prevent double scrollbar */
    }
  
    .sidebar {
      width: 250px;
      background-color: var(--primary-color);
      color: #fff;
      display: flex;
      flex-direction: column;
      padding: 20px;
      overflow-y: auto; /* make sidebar scrollable */
    }
  
    .sidebar h2 {
      font-size: 1.5rem;
      margin-bottom: 30px;
      font-weight: bold;
      text-align: center;
    }
  
    .sidebar a {
      text-decoration: none;
      color: #fff;
      padding: 12px 20px;
      margin: 5px 0;
      border-radius: 6px;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }
  
    .sidebar a:hover {
      background-color: var(--accent-color);
      color: var(--text-color);
      transform: translateX(5px);
    }
  
    #datetime {
      position: fixed;
      bottom: 20px;
      left: 20px;
      font-size: 1rem;
      color: white;
      padding: 10px;
      background-color: black;
      border-radius: 6px;
      font-family: 'Segoe UI', sans-serif;
    }
  
    .main-content {
      flex: 1;
      overflow-y: auto; /* make main content scrollable */
      padding: 50px;
    }
  
    .main-content h1 {
      font-size: 2rem;
      margin-bottom: 20px;
      color: var(--primary-color);
    }
  
    .customers-table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
  
    .customers-table thead {
      background-color: var(--primary-color);
      color: white;
    }
  
    .customers-table th, .customers-table td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
  
    .customers-table tbody tr:hover {
      background-color: var(--accent-color);
      color: var(--text-color);
    }
  
    .customers-table-container {
      background: linear-gradient(135deg, var(--accent-color) 0%, #f5e5c5 100%);
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
    }
  
    h1::before {
      content: "PathraVahak";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-30deg);
      font-size: 6rem;
      color: rgba(0, 0, 0, 0.05);
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
    }
  </style>
  
</head>
<body>
    <div class="sidebar" id="sidebar">
        <h2 style="display: flex; align-items: center; gap: 10px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="white">
            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 7h10v2H7V7zm0 4h7v2H7v-2zm0 4h10v2H7v-2z"/>
          </svg>
          PathraVahak
        </h2>

    <a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
    <a href="employees.html"><i class="fas fa-users-cog"></i> Employees</a>
    <a href="subscriptions.html"><i class="fas fa-newspaper"></i> Subscriptions</a>
    <a href="customers.html"><i class="fas fa-users"></i> Customers</a>
    <a href="deliveries.html"><i class="fas fa-box"></i> Deliveries</a>
    <a href="payments.html"><i class="fas fa-money-bill"></i> Payments</a>
    <a href="complaints.html"><i class="fas fa-exclamation-circle"></i> Complaints</a>
    <a href="newspapers.html"><i class="fas fa-book-open"></i> Newspapers</a>
    <a href="retailoutlets.html"><i class="fas fa-store"></i> Retail Outlets</a>
    <a href="retailsales.html"><i class="fas fa-shopping-cart"></i> Retail Sales</a>
    <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>
    <a href="/api/logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
  </div>

  <div class="main-content">
    <h1>Customers</h1>

    <div class="customers-table-container">
      <table class="customers-table">
        <thead>
          <tr>
            <th>Customer ID</th>
            <th>Name</th>
            <th>Address</th>
            <th>Contact Number</th>
            <th>Email Address</th>
            <th>Newspaper</th>
            <th>Subscription Status</th>
            <th>Price</th>
          </tr>
        </thead>
        <tbody id="customersTableBody">
          </tbody>
      </table>
    </div>
  </div>
  <div id="datetime"></div>
  <script>
    function updateDateTime() {
      const now = new Date();
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', timeZoneName: 'short' };
      document.getElementById('datetime').textContent = now.toLocaleDateString('en-IN', options);
    }

    setInterval(updateDateTime, 1000);
    updateDateTime(); // Initial call
    async function loadCustomers() {
  try {
    const res = await fetch(`/api/customers?ts=${Date.now()}`);
    const customers = await res.json();

    const tableBody = document.getElementById('customersTableBody');
    tableBody.innerHTML = ''; // Clear existing rows

    customers.forEach(c => {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${c.customerId}</td>
        <td>${c.customerName}</td>
        <td>${c.address}</td>
        <td>${c.contact}</td>
        <td>${c.email}</td>
        <td>${c.newspaper || 'N/A'}</td>
        <td>${c.status || 'N/A'}</td>
        <td>₹${c.price !== undefined ? c.price : 'N/A'}</td>
      `;
      tableBody.appendChild(row);
    });
  } catch (err) {
    console.error('Error loading customers:', err);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  loadCustomers();
});

async function updateSubscription(subscriptionId, updatedData) {
  try {
    const res = await fetch(`/api/subscriptions/${subscriptionId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(updatedData),
    });

    if (res.ok) {
      console.log('Subscription updated successfully.');
      // After successful update, reload customers data
      await loadCustomers();
    } else {
      console.error('Failed to update subscription.');
    }
  } catch (err) {
    console.error('Error updating subscription:', err);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  loadCustomers(); // Load customers when the page loads

  // Add Refresh Customers button
  const refreshButton = document.createElement('button');
  refreshButton.textContent = 'Refresh Customers';
  refreshButton.style.marginBottom = '20px';
  refreshButton.style.padding = '10px 20px';
  refreshButton.style.backgroundColor = '#5C2E14';
  refreshButton.style.color = '#fff';
  refreshButton.style.border = 'none';
  refreshButton.style.borderRadius = '6px';
  refreshButton.style.cursor = 'pointer';
  refreshButton.addEventListener('click', loadCustomers);

  document.querySelector('.main-content').insertBefore(refreshButton, document.querySelector('.customers-table-container'));
});

  </script>
</body>
</html>
