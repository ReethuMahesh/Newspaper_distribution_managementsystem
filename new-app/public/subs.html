}

        .form-section {

}

        .form-section,

            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);

        .form-section h2,

            margin-bottom: 15px;
            font-size: 1.25rem;
        }

        .form-group {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 15px;
        }

        .form-group label {
            flex: 1 1 200px;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            flex: 2 1 300px;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .btn {
            padding: 10px 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;

        .btn:hover {
            background-color: #3e1f0e;
        }

        .btn.active {
            background-color: var(--accent-color);
            color: var(--text-color);
        }

        table {
            width: 100%;

            margin-top: 20px;

        table th,

            border: 1px solid #ddd;

        .action-buttons button {

        .edit-btn {

        .delete-btn {

        .filter-section {

        .error-message {

    <div id="datetime"></div>
    <script>
        function updateDateTime() {
         const now = new Date();
         const options = {
          weekday: 'long',
          year: 'numeric',
          month: 'long',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          timeZoneName: 'short'
         };
         document.getElementById('datetime').textContent = now.toLocaleDateString('en-IN', options);
        }
      
        setInterval(updateDateTime, 1000);
        updateDateTime(); // Initial call

        function addDays(date, days) {
    const result = new Date(date);
    result.setDate(result.getDate() + days);
    return result;
}

function addMonths(date, months) {
    const result = new Date(date);
    result.setMonth(result.getMonth() + months);
    return result;
}

function formatDate(date) {
    const d = new Date(date),
        month = '' + (d.getMonth() + 1),
        day = '' + d.getDate(),
        year = d.getFullYear();
    return [
        year,
        month.length < 2 ? '0' + month : month,
        day.length < 2 ? '0' + day : day
    ].join('-');
}

function calculateEndDate() {
    const startDateInput = document.getElementById('startDate');
    const typeInput = document.getElementById('subscriptionType');
    const endDateInput = document.getElementById('endDate');

    const startDateValue = startDateInput.value;
    const typeValue = typeInput.value;

    if (!startDateValue || !typeValue) {
        endDateInput.value = '';
        return;
    }

    const startDate = new Date(startDateValue);
    let endDate;

    if (typeValue === 'Daily') {
        endDate = startDate;
    } else if (typeValue === 'Weekly') {
        endDate = addDays(startDate, 6);
    } else if (typeValue === 'Monthly') {
        endDate = addMonths(startDate, 1);
        endDate.setDate(endDate.getDate() - 1);
    } else {
        endDateInput.value = '';
        return;
    }

    endDateInput.value = formatDate(endDate);
}

// Attach the event listeners
document.getElementById('startDate').addEventListener('change', calculateEndDate);
document.getElementById('subscriptionType').addEventListener('change', calculateEndDate);

      
        function showSection(section, btn) {
         const formSection = document.querySelector(".form-section");
         const tableSection = document.querySelector(".table-section");
         const buttons = document.querySelectorAll(".toggle-buttons .btn");
      
         buttons.forEach((b) => b.classList.remove("active"));
         btn.classList.add("active");
      
         if (section === "add") {
          formSection.style.display = "block";
          tableSection.style.display = "none";
         } else {
          formSection.style.display = "none";
          tableSection.style.display = "block";
         }
        }
      
        let currentEditId = null; // To store the ID of the subscription being edited
        let nextCustomerId = 1;
        let existingPhoneNumbers = new Set(); // To store phone numbers
      
        function generateSubscriptionId() {
         const random = Math.floor(Math.random() * 1000).toString().padStart(3, '0');
         return `SUB${random}`;
        }
      
        function generateCustomerId() {
         const customerId = `CUS${nextCustomerId.toString().padStart(4, '0')}`;
         return customerId;
        }
      
        function populateEditForm(editButton) {
         const row = editButton.closest('tr');
         const id = editButton.dataset.id;
         currentEditId = id;
      
         const cells = row.querySelectorAll('td');
         const subscriptionId = cells[0].textContent;
         const customerName = cells[1].textContent;
         const newspapers = cells[2].textContent;
         const subscriptionType = cells[3].textContent;
         const startDate = cells[4].textContent;
         const endDate = cells[5].textContent;
         const status = cells[6].textContent;
      
         // Fetch additional customer details
         const customerId = row.dataset.customerId;
         const address = row.dataset.address;
         const contact = row.dataset.contact;
         const email = row.dataset.email;
         const deliveryTime = row.dataset.deliveryTime;
         const price = row.dataset.price;
      
      
         document.getElementById('subscriptionId').value = subscriptionId;
         document.getElementById('customerName').value = customerName;
         document.getElementById('address').value = address;
         document.getElementById('contact').value = contact;
         document.getElementById('email').value = email;
         document.getElementById('subscriptionType').value = subscriptionType;
         document.getElementById('newspapers').value = newspapers;
         document.getElementById('startDate').value = startDate;
         document.getElementById('endDate').value = endDate;
         document.getElementById('deliveryTime').value = deliveryTime;
         document.getElementById('status').value = status;
         document.getElementById('price').value = price;
         document.getElementById('customerId').value = customerId;
         document.getElementById('contact').value = contact; //set contact
      
      
         const addFormTitle = document.querySelector('.form-section h2');
         const submitButton = document.querySelector('.form-section button[type="submit"]');
      
         addFormTitle.textContent = 'Edit Subscription';
         submitButton.textContent = 'Update Subscription';
         submitButton.dataset.action = 'update'; // Add a data attribute to identify update
      
         showSection('add', document.querySelector('.toggle-buttons .btn:last-child')); // Switch to the add form
        }
      
        document.getElementById('subscriptionForm').addEventListener('submit', async function (e) {
         e.preventDefault();
      
         const subscriptionId = document.getElementById('subscriptionId').value;
         const customerId = document.getElementById('customerId').value;
         const customerName = document.getElementById('customerName').value;
         const address = document.getElementById('address').value;
         const contact = document.getElementById('contact').value;
         const email = document.getElementById('email').value;
         const subscriptionType = document.getElementById('subscriptionType').value;
         const newspapers = document.getElementById('newspapers').value;
         const startDate = document.getElementById('startDate').value;
         const endDate = document.getElementById('endDate').value;
         const deliveryTime = document.getElementById('deliveryTime').value;
         const status = document.getElementById('status').value;
         const price = parseFloat(document.getElementById('price').value);
      
      
         const data = {
          subscriptionId: subscriptionId,
          customerId: customerId,
          customerName: customerName,
          address: address,
          contact: contact,
          email: email,
          subscriptionType: subscriptionType,
          newspapers: newspapers,
          startDate: startDate,
          endDate: endDate,
          deliveryTime: deliveryTime,
          status: status,
          price: price,
         };
      
         const action = this.querySelector('button[type="submit"]').dataset.action;
         let url = '/api/subscriptions';
         let method = 'POST';
      
         if (action === 'update' && currentEditId) {
          url = `/api/subscriptions/${currentEditId}`;
          method = 'PUT';
         }
      
         // Check for duplicate phone number
         if (action === 'add' && existingPhoneNumbers.has(contact)) {
          alert('Phone number already exists. Please use a unique phone number.');
          return; // Stop submission
         }
      
         try {
          const res = await fetch(url, {
           method: method,
           headers: {
            'Content-Type': 'application/json'
           },
           body: JSON.stringify(data)
          });
      
          if (!res.ok) {
           const errorText = await res.text();
           throw new Error(`HTTP error! status: ${res.status}, body: ${errorText}`);
          }
      
          const result = await res.json();
          alert(result.message || `Subscription ${action === 'update' ? 'updated' : 'saved'}!`);
          window.location.reload();
         } catch (err) {
          console.error(err);
          alert(`Error ${action === 'update' ? 'updating' : 'adding'} subscription.  Please check console for details.`);
         } finally {
          // Reset the form and action for the next add operation
          this.querySelector('button[type="submit"]').textContent = 'Add Subscription';
          this.querySelector('button[type="submit"]').dataset.action = 'add';
          currentEditId = null;
          document.querySelector('.form-section h2').textContent = 'Add Subscription';
          resetForm(); // Call resetForm to generate new IDs
         }
        });
      
        function getStatusColor(status) {
         switch (status) {
          case 'Active':
           return 'color: green';
          case 'Pending':
           return 'color: orange';
          case 'Expired':
           return 'color: red';
          default:
           return '';
         }
        }
      
        function isExpired(endDate) {
         const today = new Date().toISOString().split('T')[0];
         return endDate < today;
        }
      
      
        async function loadSubscriptions() {
         try {
          const res = await fetch('/api/subscriptions');
          const data = await res.json();
          const tbody = document.querySelector('tbody');
          tbody.innerHTML = '';
          existingPhoneNumbers.clear(); // Clear phone numbers
          nextCustomerId = 1; // Reset counter on load
      
          data.forEach(sub => {
           const expired = isExpired(sub.endDate);
           const displayStatus = expired ? 'Expired' : sub.status;
           existingPhoneNumbers.add(sub.contact); // Add to set
      
           // Update nextCustomerId if a larger ID is found
           const currentIdNumber = parseInt(sub.customerId.slice(3), 10);
           if (!isNaN(currentIdNumber) && currentIdNumber >= nextCustomerId) {
            nextCustomerId = currentIdNumber + 1;
           }
      
           const row = document.createElement('tr');
           row.dataset.customerId = sub.customerId;
           row.dataset.address = sub.address;
           row.dataset.contact = sub.contact;
           row.dataset.email = sub.email;
           row.dataset.deliveryTime = sub.deliveryTime;
           row.dataset.price = sub.price;
           row.innerHTML = `
            <td>${sub.subscriptionId}</td>
            <td>${sub.customerName}</td>
            <td>${sub.newspapers}</td>
            <td>${sub.subscriptionType}</td>
            <td>${sub.startDate}</td>
            <td>${sub.endDate}</td>
            <td style="${getStatusColor(displayStatus)}">${displayStatus}</td>
            <td class="action-buttons">
             <button class="edit-btn" data-id="${sub._id}" onclick="populateEditForm(this)">Edit</button>
             <button class="delete-btn" data-id="${sub._id}" onclick="deleteSubscription(this)">Delete</button>
            </td>
           `;
           tbody.appendChild(row);
          });
          applyFilters(); // Apply filters after loading data
         } catch (err) {
          console.error('Failed to load subscriptions', err);
          alert('Failed to load subscriptions. Please check console for details.');
         }
        }
      
        async function deleteSubscription(deleteButton) {
         const row = deleteButton.closest('tr');
         const id = deleteButton.dataset.id;
         const contact = row.dataset.contact; //get contact to remove
      
         if (confirm("Are you sure you want to delete this subscription?")) {
          try {
           const res = await fetch(`/api/subscriptions/${id}`, {
            method: 'DELETE',
           });
           if (!res.ok) {
            const errorText = await res.text();
            throw new Error(`HTTP error! status: ${res.status}, body: ${errorText}`);
           }
           const result = await res.json();
           alert(result.message);
           existingPhoneNumbers.delete(contact); //remove contact
           window.location.reload(); // Reload to update the table
          } catch (error) {
           console.error("Error deleting subscription:", error);
           alert("Failed to delete subscription. Please check the console for details.");
          }
         }
        }
      
        function resetForm() {
         document.getElementById('subscriptionId').value = generateSubscriptionId();
         document.getElementById('customerId').value = generateCustomerId();
         document.getElementById('customerName').value = '';
         document.getElementById('address').value = '';
         document.getElementById('contact').value = '';
         document.getElementById('email').value = '';
         document.getElementById('subscriptionType').value = '';
         document.getElementById('newspapers').value = '';
         document.getElementById('startDate').value = '';
         document.getElementById('endDate').value = '';
         document.getElementById('deliveryTime').value = '';
         document.getElementById('status').value = 'Active';
         document.getElementById('price').value = '';
         document.getElementById('contact-error').textContent = '';
         document.getElementById('email-error').textContent = '';
         nextCustomerId++; // Increment for the next entry
        }
      
        function initializeForm() {
         document.getElementById('subscriptionId').value = generateSubscriptionId();
         document.getElementById('customerId').value = generateCustomerId();
        }
      
        showSection('view', document.querySelector('.toggle-buttons .btn:first-child'));
        loadSubscriptions();
      
        document.querySelector('.toggle-buttons .btn:last-child').addEventListener('click', () => {
         initializeForm();
        });
        initializeForm();
      
        const contactInput = document.getElementById('contact');
        const emailInput = document.getElementById('email');
        const contactError = document.getElementById('contact-error');
        const emailError = document.getElementById('email-error');
      
        contactInput.addEventListener('input', () => {
         const phoneRegex = /^[0-9]{10}$/;
         if (!phoneRegex.test(contactInput.value)) {
          contactError.textContent = "Phone number must be 10 digits";
         } else {
          contactError.textContent = "";
         }
        });
      
        emailInput.addEventListener('input', () => {
         const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
         if (!emailRegex.test(emailInput.value)) {
          emailError.textContent = "Invalid email format";
         } else {
          emailError.textContent = "";
         }
        });
      
      
        let emailCheckTimeout;
        emailInput.addEventListener('input', () => {
         const emailValue = emailInput.value.trim();
         clearTimeout(emailCheckTimeout);
      
         if (emailValue) {
          emailCheckTimeout = setTimeout(async () => {
           try {
            const response = await fetch(`/api/subscriptions/check-email/${emailValue}`);
            const data = await response.json();
            if (data.exists) {
             emailError.textContent = 'This email address is already in use.';
            } else {
             emailError.textContent = '';
            }
           } catch (error) {
            console.error('Error checking email:', error);
            emailError.textContent = 'Error checking email. Please try again.';
           }
          }, 300);
         } else {
          emailError.textContent = '';
         }
        });
      
      
      
        // Get filter elements
        const searchFilterInput = document.getElementById('searchFilter');
        const typeFilterSelect = document.getElementById('typeFilter');
        const statusFilterSelect = document.getElementById('statusFilter');
        const newspaperFilterSelect = document.getElementById('newspaperFilter');
      
        // Add event listeners to the filter elements
        searchFilterInput.addEventListener('input', applyFilters);
        typeFilterSelect.addEventListener('change', applyFilters);
        statusFilterSelect.addEventListener('change', applyFilters);
        newspaperFilterSelect.addEventListener('change', applyFilters);
      
        function applyFilters() {
         const searchText = searchFilterInput.value.toLowerCase();
         const selectedType = typeFilterSelect.value;
         const selectedStatus = statusFilterSelect.value;
         const selectedNewspaper = newspaperFilterSelect.value;
      
         const rows = document.querySelector('tbody').getElementsByTagName('tr');
         for (let i = 0; i < rows.length; i++) {
          const row = rows[i];
          const customerName = row.cells[1].textContent.toLowerCase();
          const newspapers = row.cells[2].textContent.toLowerCase();
          const subscriptionType = row.cells[3].textContent;
          const status = row.cells[6].textContent;
      
          const searchMatch = customerName.includes(searchText);
          const typeMatch = !selectedType || subscriptionType === selectedType;
          const statusMatch = !selectedStatus || status === selectedStatus;
          const newspaperMatch = !selectedNewspaper || newspapers.includes(selectedNewspaper.toLowerCase());
      
          if (searchMatch && typeMatch && statusMatch && newspaperMatch) {
           row.style.display = '';
          } else {
           row.style.display = 'none';
          }
         }
        }
       </script>
</body>
</html>
