<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - PathraVahak</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="logo">PathraVahak</div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="login.html" class="active">Login</a></li>
        <li><a href="register.html">Sign Up</a></li>
      </ul>
      <div class="hamburger">&#9776;</div>
    </nav>
  </header>

  <main>
    <section class="login-prompt">
      <h2>Welcome Back</h2>
      <p id="form-desc">Please login to continue</p>

      <!-- Login Form -->
      <form id="loginForm" method="post" action="/api/login">
        <div style="margin-bottom: 20px; text-align: left;">
          <label for="email">Email:</label><br />
          <input type="email" name="email" required style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;" />
        </div>
        <div style="margin-bottom: 20px; text-align: left;">
          <label for="password">Password:</label><br />
          <input type="password" name="password" required style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;" />
        </div>
        <button type="submit" class="button" style="width: 100%;">Login</button>
      </form>

      <!-- Forgot Password Link -->
      <div style="margin-top: 10px; text-align: right;">
        <a href="#" id="show-otp-form" style="color: #3498db; text-decoration: none;">Forgot Password?</a>
      </div>

      <!-- Request OTP Form -->
      <form id="otpRequestForm" style="display: none;" method="post">
        <div style="margin-bottom: 20px; text-align: left;">
          <label for="resetEmail">Enter your registered email:</label><br />
          <input type="email" id="resetEmail" name="email" required style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;" />
        </div>
        <button type="submit" class="button" style="width: 100%;">Send OTP</button>
        <div style="margin-top: 10px; text-align: right;">
          <a href="#" id="back-to-login1" style="color: #3498db; text-decoration: none;">Back to Login</a>
        </div>
      </form>

      <!-- OTP and New Password Form -->
      <form id="otpVerifyForm" style="display: none;" method="post">
        <div style="margin-bottom: 20px; text-align: left;">
          <label for="otp">Enter OTP sent to your email:</label><br />
          <input type="text" id="otp" name="otp" required style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;" />
        </div>
        <div style="margin-bottom: 20px; text-align: left;">
          <label for="newPassword">New Password:</label><br />
          <input type="password" id="newPassword" name="newPassword" required style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;" />
        </div>
        <input type="hidden" id="otpEmail" name="email" />
        <button type="submit" class="button" style="width: 100%;">Reset Password</button>
        <div style="margin-top: 10px; text-align: right;">
          <a href="#" id="back-to-login2" style="color: #3498db; text-decoration: none;">Back to Login</a>
        </div>
      </form>

      <p id="message" style="margin-top: 20px; color: #ff4757;"></p>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-container">
      <div>
        <h4>About PathraVahak</h4>
        <p>Your trusted daily news carrier.</p>
      </div>
      <div>
        <h4>Quick Links</h4>
        <p><a href="index.html">Home</a></p>
        <p><a href="register.html">Sign Up</a></p>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2025 Daily Press. All rights reserved.</p>
    </div>
  </footer>

  <script>
    // Hamburger menu
    const hamburger = document.querySelector('.hamburger');
    const navUL = document.querySelector('nav ul');
    hamburger.addEventListener('click', () => {
      navUL.classList.toggle('show');
    });

    // OTP Flow
    const loginForm = document.getElementById('loginForm');
    const otpRequestForm = document.getElementById('otpRequestForm');
    const otpVerifyForm = document.getElementById('otpVerifyForm');
    const showOtpForm = document.getElementById('show-otp-form');
    const backToLogin1 = document.getElementById('back-to-login1');
    const backToLogin2 = document.getElementById('back-to-login2');
    const message = document.getElementById('message');
    const formDesc = document.getElementById('form-desc');

    showOtpForm.onclick = function(e) {
      e.preventDefault();
      loginForm.style.display = 'none';
      otpRequestForm.style.display = 'block';
      otpVerifyForm.style.display = 'none';
      message.textContent = '';
      formDesc.textContent = "Enter your email to receive an OTP";
    };

    backToLogin1.onclick = backToLogin2.onclick = function(e) {
      e.preventDefault();
      loginForm.style.display = 'block';
      otpRequestForm.style.display = 'none';
      otpVerifyForm.style.display = 'none';
      message.textContent = '';
      formDesc.textContent = "Please login to continue";
    };

    otpRequestForm.onsubmit = async function(e) {
      e.preventDefault();
      const email = document.getElementById('resetEmail').value;
      message.textContent = 'Sending OTP...';
      try {
        const res = await fetch('/api/request-reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const text = await res.text();
        if (res.ok) {
          message.style.color = '#2ecc40';
          message.textContent = 'OTP sent to your email. Please check your inbox.';
          otpRequestForm.style.display = 'none';
          otpVerifyForm.style.display = 'block';
          document.getElementById('otpEmail').value = email;
          formDesc.textContent = "Enter the OTP and your new password";
        } else {
          message.style.color = '#ff4757';
          message.textContent = text;
        }
      } catch (err) {
        message.style.color = '#ff4757';
        message.textContent = 'Error sending OTP. Please try again.';
      }
    };

    otpVerifyForm.onsubmit = async function(e) {
      e.preventDefault();
      const email = document.getElementById('otpEmail').value;
      const otp = document.getElementById('otp').value;
      const newPassword = document.getElementById('newPassword').value;
      message.textContent = 'Resetting password...';
      try {
        const res = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, otp, newPassword })
        });
        const text = await res.text();
        if (res.ok) {
          message.style.color = '#2ecc40';
          message.textContent = 'Password reset successful. You can now login.';
          otpVerifyForm.style.display = 'none';
          loginForm.style.display = 'block';
          formDesc.textContent = "Please login to continue";
        } else {
          message.style.color = '#ff4757';
          message.textContent = text;
        }
      } catch (err) {
        message.style.color = '#ff4757';
        message.textContent = 'Error resetting password. Please try again.';
      }
    };
  </script>
</body>
</html>
